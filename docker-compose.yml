services:
  vaultmind:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      HOST: 0.0.0.0
      PORT: 8787
      VAULTMIND_SESSION_SECRET: ${VAULTMIND_SESSION_SECRET:-vaultmind-local-compose-session-secret-change-me}
      LYZR_API_URL: ${LYZR_API_URL:-https://agent-prod.studio.lyzr.ai/v3/inference/chat/}
      LYZR_API_KEY: ${LYZR_API_KEY:-}
      LYZR_AGENT_ID: ${LYZR_AGENT_ID:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-vaultmind_memories}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-768}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSION: ${GEMINI_EMBEDDING_DIMENSION:-768}
      OMI_WEBHOOK_TOKEN: ${OMI_WEBHOOK_TOKEN:-}
      OMI_API_KEY: ${OMI_API_KEY:-}
      OMI_API_BASE_URL: ${OMI_API_BASE_URL:-https://api.omi.me}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
    volumes:
      - vaultmind_qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/readyz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  vaultmind_qdrant:
